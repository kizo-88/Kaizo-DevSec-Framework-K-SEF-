# ==============================================================================
# Kaizo DevSec Framework - Hardened Production Nginx Configuration
# Mitigates: CWE-319, CWE-693, CWE-1021, CWE-525, CWE-311, Information Leaks
# ==============================================================================

# 1. Hide Nginx Version Information
server_tokens off;

# 2. Global HTTP to HTTPS Redirect (Mitigates CWE-311)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Immediate 301 Permanent Redirect to HTTPS
    return 301 https://$host$request_uri;
}

# 3. Secure Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaizo-app.com www.kaizo-app.com;

    # SSL / TLS Modern Cryptography
    ssl_certificate /etc/letsencrypt/live/kaizo-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaizo-app.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # HARDENED SECURITY HEADERS
    # -------------------------------------------------------------------------

    # 1. HSTS (Mitigates CWE-319) - 2 Years duration with preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 2. X-Content-Type-Options (Mitigates CWE-693 MIME Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Anti-Clickjacking (Mitigates CWE-1021)
    add_header X-Frame-Options "DENY" always;

    # 4. Content Security Policy (CSP - Mitigates CWE-693 & XSS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.kaizo-app.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # 5. Referrer Policy & Permissions Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # 6. Cross-Origin Policies (COOP, COEP, CORP)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # -------------------------------------------------------------------------
    # API & APPLICATION REVERSE PROXY
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable Caching for Dynamic/Sensitive API Routes (Mitigates CWE-525)
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # -------------------------------------------------------------------------
    # STATIC ASSETS (Immutable Caching)
    # -------------------------------------------------------------------------
    location /static/ {
        root /var/www/kaizo-app/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
